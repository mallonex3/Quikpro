<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="QuikPro - Trouve ou propose des services">
  <title>QuikPro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding-bottom: 70px;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .category-btn {
      border: none;
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category-btn.active {
      background: #111827;
      color: white;
    }

    .service {
      background: white;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .service h2 {
      margin: 0 0 8px;
    }

    .category {
      display: inline-block;
      background: #e5e7eb;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 13px;
    }

    .description {
      color: #4b5563;
      margin-top: 10px;
      line-height: 1.5;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0;
    }

    .contact {
      width: 100%;
      border: none;
      background: #22c55e;
      color: white;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-section {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .add-section h2 {
      margin-top: 0;
    }

    .form-input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    .add-button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111827;
      color: white;
      text-align: center;
      padding: 13px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>QuikPro</h1>
  <p>Trouve ou propose un service près de chez toi</p>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Rechercher un service..."
  >

  <div class="categories">

    <button
      class="category-btn active"
      onclick="filterCategory('Tous', this)">
      Tous
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Informatique', this)">
      💻 Informatique
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Jardinage', this)">
      🌱 Jardinage
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Bricolage', this)">
      🔨 Bricolage
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Animaux', this)">
      🐶 Animaux
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Autre', this)">
      ⭐ Autre
    </button>

  </div>

  <div id="services"></div>

  <div class="add-section">

    <h2>➕ Proposer un service</h2>

    <input
      id="title"
      class="form-input"
      type="text"
      placeholder="Nom du service"
    >

    <input
      id="category"
      class="form-input"
      type="text"
      placeholder="Catégorie"
    >

    <input
      id="price"
      class="form-input"
      type="number"
      placeholder="Prix (€)"
    >

    <!-- CHAMP WHATSAPP -->
    <input
      id="phone"
      class="form-input"
      type="tel"
      placeholder="📱 Numéro WhatsApp"
    >

    <textarea
      id="description"
      class="form-input"
      rows="4"
      placeholder="Description"
    ></textarea>

    <button
      class="add-button"
      onclick="addService()">
      Publier
    </button>

  </div>

</div>

<footer>
  QuikPro • Services entre particuliers
</footer>

<script>

let services =
  JSON.parse(localStorage.getItem("quikpro_services")) || [

  {
    title: "Aide informatique",
    category: "Informatique",
    price: 15,
    description: "Aide pour ordinateur, téléphone et logiciels.",
    phone: ""
  },

  {
    title: "Tonte de pelouse",
    category: "Jardinage",
    price: 20,
    description: "Je peux aider à entretenir votre pelouse.",
    phone: ""
  },

  {
    title: "Petits travaux",
    category: "Bricolage",
    price: 15,
    description: "Aide pour différents petits travaux.",
    phone: ""
  }

];

let currentCategory = "Tous";


function saveServices() {

  localStorage.setItem(
    "quikpro_services",
    JSON.stringify(services)
  );

}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function displayServices() {

  const container =
    document.getElementById("services");

  const searchText =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  container.innerHTML = "";

  const filtered =
    services.filter(service => {

      const categoryMatch =
        currentCategory === "Tous" ||
        service.category.toLowerCase() ===
        currentCategory.toLowerCase();

      const searchMatch =
        service.title.toLowerCase().includes(searchText) ||
        service.category.toLowerCase().includes(searchText) ||
        service.description.toLowerCase().includes(searchText);

      return categoryMatch && searchMatch;

    });


  if (filtered.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Aucun service trouvé.
      </div>
    `;

    return;
  }


  filtered.forEach(service => {

    const card =
      document.createElement("div");

    card.className = "service";


    card.innerHTML = `

      <h2>
        ${escapeHTML(service.title)}
      </h2>

      <span class="category">
        ${escapeHTML(service.category)}
      </span>

      <div class="description">
        ${escapeHTML(service.description)}
      </div>

      <div class="price">
        ${escapeHTML(service.price)} €
      </div>

      <button
        class="contact"
        onclick="contactWhatsApp(
          '${escapeHTML(service.phone || "")}',
          '${escapeHTML(service.title)}'
        )">

        💬 Contacter

      </button>

    `;

    container.appendChild(card);

  });

}


function filterCategory(category, button) {

  currentCategory = category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  displayServices();

}


function contactWhatsApp(phone, title) {

  if (!phone || phone.trim() === "") {

    alert(
      "Ce service n'a pas de numéro WhatsApp renseigné."
    );

    return;
  }


  let cleanPhone =
    phone.replace(/[^\d+]/g, "");


  if (cleanPhone.startsWith("0")) {

    cleanPhone =
      "33" + cleanPhone.substring(1);

  }


  cleanPhone =
    cleanPhone.replace("+", "");


  const message =
    "Bonjour, je vous contacte depuis QuikPro concernant le service : " +
    title;


  const whatsappURL =
    "https://wa.me/" +
    cleanPhone +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappURL,
    "_blank"
  );

}


function addService() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const description =
    document.getElementById("description").value.trim();


  if (
    !title ||
    !category ||
    !price ||
    !description
  ) {

    alert(
      "Merci de remplir le nom, la catégorie, le prix et la description."
    );

    return;
  }


  services.push({

    title: title,

    category: category,

    price: Number(price),

    description: description,

    phone: phone

  });


  saveServices();


  document.getElementById("title").value = "";

  document.getElementById("category").value = "";

  document.getElementById("price").value = "";

  document.getElementById("phone").value = "";

  document.getElementById("description").value = "";


  displayServices();


  alert(
    "Service publié avec succès !"
  );

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    displayServices
  );


displayServices();

</script>

</body>
</html>
