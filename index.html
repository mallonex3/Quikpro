<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="/Quikpro/manifest.json">

<title>QuikPro</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f5f5;
  color:#111;
  padding-bottom:80px;
}

header{
  background:#111;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:20;
}

.header{
  max-width:1000px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#ffd400;
}

.header button{
  background:#ffd400;
  color:#111;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.hero{
  background:#111;
  color:white;
  border-radius:25px;
  padding:28px 22px;
  margin-bottom:20px;
}

.hero h1{
  font-size:32px;
  margin-bottom:10px;
}

.hero p{
  color:#ddd;
  line-height:1.5;
  margin-bottom:20px;
}

.search{
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:16px;
}

.primary{
  background:#ffd400;
  color:#111;
  border:0;
  border-radius:12px;
  padding:14px 18px;
  font-weight:bold;
  cursor:pointer;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.category{
  white-space:nowrap;
  border:1px solid #ddd;
  background:white;
  padding:10px 14px;
  border-radius:30px;
  cursor:pointer;
}

.category.active{
  background:#111;
  color:white;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0 12px;
}

.section-title h2{
  font-size:21px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.card-img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#ddd;
}

.card-content{
  padding:15px;
}

.badge{
  display:inline-block;
  background:#eee;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  margin-bottom:8px;
}

.card h3{
  margin-bottom:7px;
}

.description{
  color:#666;
  font-size:14px;
  line-height:1.4;
  min-height:40px;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin-top:12px;
}

.author{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.small-btn{
  flex:1;
  border:0;
  border-radius:10px;
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}

.dark{
  background:#111;
  color:white;
}

.yellow{
  background:#ffd400;
  color:#111;
}

.white{
  background:#eee;
  color:#111;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.form{
  background:white;
  border-radius:20px;
  padding:20px;
}

.form label{
  display:block;
  font-weight:bold;
  margin:14px 0 6px;
}

.form input,
.form textarea,
.form select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  font-family:inherit;
}

.form textarea{
  min-height:110px;
  resize:vertical;
}

.form button{
  margin-top:18px;
  width:100%;
}

.preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:15px;
  margin-top:10px;
  display:none;
}

.profile{
  background:#111;
  color:white;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#ffd400;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:12px;
}

.empty{
  text-align:center;
  background:white;
  border-radius:18px;
  padding:30px;
  color:#777;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  gap:5px;
  padding:8px;
  z-index:30;
}

.nav-btn{
  flex:1;
  max-width:180px;
  border:0;
  background:white;
  padding:9px 5px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.nav-btn.active{
  background:#111;
  color:white;
}

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  background:white;
  border-radius:20px;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  padding:22px;
}

.modal h2{
  margin-bottom:12px;
}

.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
  cursor:pointer;
}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:13px 18px;
  border-radius:12px;
  display:none;
  z-index:200;
}

@media(max-width:600px){
  .hero h1{
    font-size:27px;
  }

  .search{
    flex-direction:column;
  }

  .search button{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">Quik<span>Pro</span></div>
    <button onclick="showPage('create')">+ Proposer</button>
  </div>
</header>

<main class="container">

<!-- ACCUEIL -->
<section id="home" class="page active">

  <div class="hero">
    <h1>Trouve quelqu'un qui sait faire.</h1>
    <p>
      Découvre des personnes qui proposent leurs compétences :
      montage vidéo, graphisme, photo, informatique, audio et bien plus.
    </p>

    <div class="search">
      <input id="searchInput" type="text"
        placeholder="Rechercher une compétence..."
        oninput="renderServices()">

      <button class="primary" onclick="renderServices()">
        Rechercher
      </button>
    </div>
  </div>

  <div class="categories">
    <button class="category active" onclick="setCategory('Toutes',this)">Toutes</button>
    <button class="category" onclick="setCategory('Montage vidéo',this)">🎬 Montage</button>
    <button class="category" onclick="setCategory('Graphisme',this)">🎨 Graphisme</button>
    <button class="category" onclick="setCategory('Photo',this)">📸 Photo</button>
    <button class="category" onclick="setCategory('Informatique',this)">💻 Informatique</button>
    <button class="category" onclick="setCategory('Audio',this)">🎵 Audio</button>
    <button class="category" onclick="setCategory('Réseaux sociaux',this)">📱 Réseaux</button>
    <button class="category" onclick="setCategory('Autre',this)">✨ Autre</button>
  </div>

  <div class="section-title">
    <h2>Services disponibles</h2>
    <span id="count"></span>
  </div>

  <div id="servicesGrid" class="grid"></div>

</section>


<!-- CREATION -->
<section id="create" class="page">

  <div class="section-title">
    <h2>Proposer mes compétences</h2>
  </div>

  <div class="form">

    <label>Ton nom ou pseudo</label>
    <input id="author" placeholder="Ex : Mallone">

    <label>Nom du service</label>
    <input id="serviceTitle"
      placeholder="Ex : Montage vidéo TikTok">

    <label>Catégorie</label>
    <select id="serviceCategory">
      <option>Montage vidéo</option>
      <option>Graphisme</option>
      <option>Photo</option>
      <option>Informatique</option>
      <option>Audio</option>
      <option>Réseaux sociaux</option>
      <option>Autre</option>
    </select>

    <label>Description</label>
    <textarea id="serviceDescription"
      placeholder="Explique ce que tu proposes..."></textarea>

    <label>Prix</label>
    <input id="servicePrice"
      type="number"
      min="0"
      step="0.01"
      placeholder="Ex : 10">

    <label>Ville / secteur</label>
    <input id="serviceLocation"
      placeholder="Ex : Dijon">

    <label>Image du service</label>
    <input id="serviceImage"
      type="file"
      accept="image/*"
      onchange="previewImage(event)">

    <img id="preview" class="preview">

    <button class="primary" onclick="createService()">
      Publier mon service
    </button>

  </div>
</section>


<!-- MES SERVICES -->
<section id="myservices" class="page">

  <div class="section-title">
    <h2>Mes services</h2>
  </div>

  <div id="myServicesGrid" class="grid"></div>

</section>


<!-- FAVORIS -->
<section id="favorites" class="page">

  <div class="section-title">
    <h2>❤️ Mes favoris</h2>
  </div>

  <div id="favoritesGrid" class="grid"></div>

</section>


<!-- PROFIL -->
<section id="profile" class="page">

  <div class="profile">
    <div class="avatar" id="profileAvatar">Q</div>
    <h2 id="profileName">Mon profil</h2>
    <p style="margin-top:8px;color:#ccc">
      Présente tes compétences sur QuikPro.
    </p>
  </div>

  <div class="form">

    <label>Nom / pseudo</label>
    <input id="profileNameInput" placeholder="Ton nom">

    <label>Présentation</label>
    <textarea id="profileBio"
      placeholder="Présente tes compétences..."></textarea>

    <button class="primary" onclick="saveProfile()">
      Enregistrer mon profil
    </button>

  </div>

</section>

</main>


<!-- NAVIGATION -->
<nav class="bottom-nav">

  <button class="nav-btn active" onclick="showPage('home',this)">
    🏠<br>Accueil
  </button>

  <button class="nav-btn" onclick="showPage('create',this)">
    ➕<br>Proposer
  </button>

  <button class="nav-btn" onclick="showPage('myservices',this)">
    📋<br>Mes services
  </button>

  <button class="nav-btn" onclick="showPage('favorites',this)">
    ❤️<br>Favoris
  </button>

  <button class="nav-btn" onclick="showPage('profile',this)">
    👤<br>Profil
  </button>

</nav>


<!-- MODAL -->
<div id="modalBg" class="modal-bg">

  <div class="modal">

    <button class="close" onclick="closeModal()">×</button>

    <div id="modalContent"></div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

let services = JSON.parse(localStorage.getItem("quikpro_services")) || [];

let favorites = JSON.parse(localStorage.getItem("quikpro_favorites")) || [];

let profile = JSON.parse(localStorage.getItem("quikpro_profile")) || {
  name:"",
  bio:""
};

let selectedCategory = "Toutes";


/* SERVICES DE DEMONSTRATION */

if(services.length === 0){

  services = [

    {
      id:1,
      author:"Alex",
      title:"Montage vidéo TikTok",
      category:"Montage vidéo",
      description:"Je réalise des montages courts pour TikTok, Shorts et Reels.",
      price:10,
      location:"Dijon",
      image:"",
      demo:true
    },

    {
      id:2,
      author:"Léo",
      title:"Création de logo",
      category:"Graphisme",
      description:"Création de logos simples et modernes.",
      price:15,
      location:"Chalon-sur-Saône",
      image:"",
      demo:true
    },

    {
      id:3,
      author:"Max",
      title:"Aide informatique",
      category:"Informatique",
      description:"Aide pour ordinateur, téléphone et logiciels.",
      price:8,
      location:"Bourgogne",
      image:"",
      demo:true
    }

  ];

  saveServices();
}


/* NAVIGATION */

function showPage(page,button){

  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.classList.remove("active");
  });

  if(button){
    button.classList.add("active");
  }

  if(page==="home"){
    renderServices();
  }

  if(page==="myservices"){
    renderMyServices();
  }

  if(page==="favorites"){
    renderFavorites();
  }

  if(page==="profile"){
    loadProfile();
  }

  window.scrollTo(0,0);
}


/* CATEGORIES */

function setCategory(category,button){

  selectedCategory=category;

  document.querySelectorAll(".category").forEach(b=>{
    b.classList.remove("active");
  });

  button.classList.add("active");

  renderServices();
}


/* AFFICHAGE */

function renderServices(){

  const grid=document.getElementById("servicesGrid");

  const search=document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  let filtered=services.filter(service=>{

    const matchesCategory=
      selectedCategory==="Toutes" ||
      service.category===selectedCategory;

    const text=
      (
        service.title+" "+
        service.description+" "+
        service.author+" "+
        service.category+" "+
        service.location
      ).toLowerCase();

    const matchesSearch=
      !search || text.includes(search);

    return matchesCategory && matchesSearch;
  });

  document.getElementById("count").textContent=
    filtered.length+" service"+(filtered.length>1?"s":"");

  if(filtered.length===0){

    grid.innerHTML=`
      <div class="empty">
        <h3>Aucun service trouvé</h3>
        <p style="margin-top:8px">
          Essaie une autre recherche ou catégorie.
        </p>
      </div>
    `;

    return;
  }

  grid.innerHTML=filtered.map(serviceCard).join("");
}


function serviceCard(service){

  const isFavorite=favorites.includes(service.id);

  return `

  <article class="card">

    ${
      service.image
      ?
      `<img class="card-img" src="${service.image}">`
      :
      `<div class="card-img"
        style="display:flex;align-items:center;justify-content:center;font-size:55px">
        ${getEmoji(service.category)}
      </div>`
    }

    <div class="card-content">

      <span class="badge">${getEmoji(service.category)} ${escapeHtml(service.category)}</span>

      <h3>${escapeHtml(service.title)}</h3>

      <p class="description">
        ${escapeHtml(service.description)}
      </p>

      <div class="price">
        ${Number(service.price).toFixed(2)} €
      </div>

      <div class="author">
        👤 ${escapeHtml(service.author)}
        <br>
        📍 ${escapeHtml(service.location || "Non indiqué")}
      </div>

      <div class="card-actions">

        <button class="small-btn dark"
          onclick="openService(${service.id})">
          Voir
        </button>

        <button class="small-btn ${isFavorite?'yellow':'white'}"
          onclick="toggleFavorite(${service.id})">
          ${isFavorite?'❤️':'♡'}
        </button>

      </div>

    </div>

  </article>

  `;
}


/* DETAILS */

function openService(id){

  const service=services.find(s=>s.id===id);

  if(!service) return;

  document.getElementById("modalContent").innerHTML=`

    ${
      service.image
      ?
      `<img src="${service.image}"
       style="width:100%;max-height:250px;object-fit:cover;border-radius:15px;margin-bottom:15px">`
      :
      `<div style="font-size:70px;text-align:center;margin:10px">
        ${getEmoji(service.category)}
      </div>`
    }

    <span class="badge">
      ${getEmoji(service.category)} ${escapeHtml(service.category)}
    </span>

    <h2>${escapeHtml(service.title)}</h2>

    <p style="margin:12px 0;color:#555;line-height:1.5">
      ${escapeHtml(service.description)}
    </p>

    <h2>${Number(service.price).toFixed(2)} €</h2>

    <p style="margin-top:8px;color:#777">
      👤 ${escapeHtml(service.author)}<br>
      📍 ${escapeHtml(service.location || "Non indiqué")}
    </p>

    <button class="primary"
      onclick="contactService(${service.id})"
      style="width:100%;margin-top:18px">
      📩 Demander ce service
    </button>

  `;

  document.getElementById("modalBg").style.display="flex";
}


function closeModal(){
  document.getElementById("modalBg").style.display="none";
}


/* CONTACT */

function contactService(id){

  const service=services.find(s=>s.id===id);

  if(!service) return;

  closeModal();

  showToast(
    "Demande enregistrée pour "+service.title
  );
}


/* FAVORIS */

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites=favorites.filter(x=>x!==id);

    showToast("Retiré des favoris");

  }else{

    favorites.push(id);

    showToast("Ajouté aux favoris ❤️");
  }

  localStorage.setItem(
    "quikpro_favorites",
    JSON.stringify(favorites)
  );

  renderServices();
  renderFavorites();
}


function renderFavorites(){

  const grid=document.getElementById("favoritesGrid");

  const fav=services.filter(s=>favorites.includes(s.id));

  if(fav.length===0){

    grid.innerHTML=`
      <div class="empty">
        <h3>Aucun favori</h3>
        <p style="margin-top:8px">
          Ajoute des services avec ❤️
        </p>
      </div>
    `;

    return;
  }

  grid.innerHTML=fav.map(serviceCard).join("");
}


/* CREATION */

function previewImage(event){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(e){

    const preview=document.getElementById("preview");

    preview.src=e.target.result;

    preview.style.display="block";
  };

  reader.readAsDataURL(file);
}


function createService(){

  const author=document.getElementById("author").value.trim();
  const title=document.getElementById("serviceTitle").value.trim();
  const category=document.getElementById("serviceCategory").value;
  const description=document.getElementById("serviceDescription").value.trim();
  const price=document.getElementById("servicePrice").value;
  const location=document.getElementById("serviceLocation").value.trim();

  const image=document.getElementById("preview").src || "";

  if(!author || !title || !description || !price){

    showToast("Remplis les champs principaux");

    return;
  }

  const service={

    id:Date.now(),

    author:author,

    title:title,

    category:category,

    description:description,

    price:Number(price),

    location:location || "Non indiqué",

    image:image.startsWith("data:image") ? image : "",

    demo:false
  };

  services.unshift(service);

  saveServices();

  document.getElementById("author").value="";
  document.getElementById("serviceTitle").value="";
  document.getElementById("serviceDescription").value="";
  document.getElementById("servicePrice").value="";
  document.getElementById("serviceLocation").value="";

  document.getElementById("serviceImage").value="";

  document.getElementById("preview").style.display="none";

  showToast("Service publié avec succès 🎉");

  showPage("myservices");

}


/* MES SERVICES */

function renderMyServices(){

  const grid=document.getElementById("myServicesGrid");

  const myName=profile.name;

  const mine=services.filter(s=>
    !s.demo &&
    (!myName || s.author===myName)
  );

  if(mine.length===0){

    grid.innerHTML=`
      <div class="empty">
        <h3>Tu n'as pas encore de service</h3>
        <button class="primary"
          onclick="showPage('create')">
          + Créer mon premier service
        </button>
      </div>
    `;

    return;
  }

  grid.innerHTML=mine.map(service=>`

    <article class="card">

      ${
        service.image
        ?
        `<img class="card-img" src="${service.image}">`
        :
        `<div class="card-img"
          style="display:flex;align-items:center;justify-content:center;font-size:55px">
          ${getEmoji(service.category)}
        </div>`
      }

      <div class="card-content">

        <span class="badge">
          ${escapeHtml(service.category)}
        </span>

        <h3>${escapeHtml(service.title)}</h3>

        <p class="description">
          ${escapeHtml(service.description)}
        </p>

        <div class="price">
          ${Number(service.price).toFixed(2)} €
        </div>

        <div class="card-actions">

          <button class="small-btn dark"
            onclick="openService(${service.id})">
            Voir
          </button>

          <button class="small-btn"
            style="background:#ffdddd"
            onclick="deleteService(${service.id})">
            🗑️ Supprimer
          </button>

        </div>

      </div>

    </article>

  `).join("");
}


function deleteService(id){

  if(!confirm("Supprimer ce service ?")) return;

  services=services.filter(s=>s.i
