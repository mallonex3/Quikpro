<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#111827">
  <meta name="description" content="QuikPro - Trouve ou propose des services près de chez toi">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <title>QuikPro</title>
</head>

<body>

<header>
  <h1>⚡ QuikPro</h1>
  <p>Les services, simplement.</p>
</header>

<main>

  <section id="home">
    <h2>Que recherches-tu ?</h2>

    <input
      id="search"
      type="search"
      placeholder="Rechercher un service..."
      oninput="searchServices()"
    >

    <div class="categories">
      <button onclick="filterServices('Tous')">Tous</button>
      <button onclick="filterServices('Informatique')">💻 Informatique</button>
      <button onclick="filterServices('Jardinage')">🌱 Jardinage</button>
      <button onclick="filterServices('Cours')">📚 Cours</button>
      <button onclick="filterServices('Animaux')">🐶 Animaux</button>
      <button onclick="filterServices('Maison')">🏠 Maison</button>
    </div>

    <div id="services"></div>
  </section>

  <section id="add" class="page hidden">
    <h2>➕ Proposer un service</h2>

    <input id="serviceTitle" placeholder="Nom du service">
    
    <select id="serviceCategory">
      <option>Informatique</option>
      <option>Jardinage</option>
      <option>Cours</option>
      <option>Animaux</option>
      <option>Maison</option>
    </select>

    <input id="servicePrice" type="number" placeholder="Prix (€)">

    <textarea
      id="serviceDescription"
      placeholder="Décris ton service..."
    ></textarea>

    <button class="primary" onclick="addService()">
      Publier le service
    </button>
  </section>

  <section id="profile" class="page hidden">
    <h2>👤 Mon profil</h2>

    <input id="username" placeholder="Ton prénom">

    <button class="primary" onclick="saveProfile()">
      Enregistrer
    </button>

    <button onclick="installApp()">
      📲 Installer QuikPro
    </button>

    <p id="profileMessage"></p>
  </section>

</main>

<nav>
  <button onclick="showPage('home')">🏠<span>Accueil</span></button>
  <button onclick="showPage('add')">➕<span>Proposer</span></button>
  <button onclick="showPage('profile')">👤<span>Profil</span></button>
</nav>

<script src="app.js"></script>

</body>
</html>
