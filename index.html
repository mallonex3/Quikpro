<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0f">

  <link rel="manifest" href="/Quikpro/manifest.json">

  <title>QuikPro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 22px;
    }

    /* HEADER */

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
    }

    .brand {
      font-size: 24px;
      font-weight: bold;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #202027;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* ACCUEIL */

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #a5a5ad;
      font-size: 16px;
    }

    /* BOUTON PRINCIPAL */

    .main-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 20px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 30px;
      transition: transform 0.2s;
    }

    .main-button:active {
      transform: scale(0.97);
    }

    /* TITRES */

    .section-title {
      font-size: 20px;
      margin-bottom: 14px;
    }

    /* ACTIONS */

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }

    .card {
      background: #17171d;
      border: 1px solid #25252d;
      border-radius: 18px;
      padding: 20px;
      min-height: 130px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card:hover {
      background: #1d1d25;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 17px;
      margin-bottom: 5px;
    }

    .card p {
      color: #9999a3;
      font-size: 13px;
    }

    /* PROJET */

    .project {
      background: #17171d;
      border: 1px solid #25252d;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 25px;
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .project h3 {
      font-size: 17px;
    }

    .project span {
      color: #9999a3;
      font-size: 13px;
    }

    /* NAVIGATION */

    .bottom-nav {
      position: sticky;
      bottom: 12px;
      background: rgba(23, 23, 29, 0.95);
      border: 1px solid #292931;
      border-radius: 20px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      backdrop-filter: blur(10px);
      margin-top: 25px;
    }

    .nav-item {
      background: none;
      border: none;
      color: #9999a3;
      font-size: 13px;
      cursor: pointer;
    }

    .nav-item.active {
      color: white;
      font-weight: bold;
    }

    /* ANIMATION */

    .app {
      animation: apparition 0.5s ease;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header>
      <div class="logo-area">
        <img
          class="logo"
          src="/Quikpro/quikpro-icon-192-1.png"
          alt="Logo QuikPro"
        >

        <div class="brand">QuikPro</div>
      </div>

      <div class="profile">👤</div>
    </header>


    <!-- ACCUEIL -->

    <section class="welcome">
      <h1>Bienvenue 👋</h1>
      <p>Tout ce dont tu as besoin, rapidement.</p>
    </section>


    <!-- BOUTON PRINCIPAL -->

    <button class="main-button" onclick="commencer()">
      🚀 Commencer
    </button>


    <!-- ACTIONS RAPIDES -->

    <h2 class="section-title">Actions rapides</h2>

    <section class="actions">

      <div class="card" onclick="action('nouveau')">
        <div class="icon">➕</div>
        <h3>Nouveau</h3>
        <p>Créer quelque chose</p>
      </div>

      <div class="card" onclick="action('projets')">
        <div class="icon">📁</div>
        <h3>Mes projets</h3>
        <p>Retrouver tes projets</p>
      </div>

      <div class="card" onclick="action('outils')">
        <div class="icon">⚡</div>
        <h3>Outils</h3>
        <p>Accéder rapidement aux outils</p>
      </div>

      <div class="card" onclick="action('parametres')">
        <div class="icon">⚙️</div>
        <h3>Paramètres</h3>
        <p>Personnaliser QuikPro</p>
      </div>

    </section>


    <!-- PROJET -->

    <h2 class="section-title">Dernière activité</h2>

    <div class="project">
      <div class="project-top">
        <h3>🚀 Ton espace QuikPro</h3>
        <span>Maintenant</span>
      </div>
    </div>


    <!-- NAVIGATION -->

    <nav class="bottom-nav">

      <button class="nav-item active" onclick="navigation('accueil')">
        🏠<br>
        Accueil
      </button>

      <button class="nav-item" onclick="navigation('projets')">
        📁<br>
        Projets
      </button>

      <button class="nav-item" onclick="navigation('outils')">
        ⚡<br>
        Outils
      </button>

      <button class="nav-item" onclick="navigation('profil')">
        👤<br>
        Profil
      </button>

    </nav>

  </main>


  <script>

    function commencer() {
      alert("Bienvenue sur QuikPro 🚀");
    }

    function action(type) {

      if (type === "nouveau") {
        alert("Création d'un nouveau projet ➕");
      }

      if (type === "projets") {
        alert("Tes projets apparaîtront ici 📁");
      }

      if (type === "outils") {
        alert("Les outils QuikPro arrivent bientôt ⚡");
      }

      if (type === "parametres") {
        alert("Les paramètres arrivent bientôt ⚙️");
      }

    }

    function navigation(page) {
      alert("Section : " + page);
    }

    /* SERVICE WORKER */

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/Quikpro/service-worker.js")
        .then(() => {
          console.log("Service Worker actif");
        })
        .catch(error => {
