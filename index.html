<!DOCTYPE html>
<html lang="fr">
<head>

<title>QuikPro</title>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0f;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 22px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
  animation: apparition 0.3s ease;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 35px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: cover;
}

.brand {
  font-size: 24px;
  font-weight: bold;
}

.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #202027;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.welcome p {
  color: #a5a5ad;
}
