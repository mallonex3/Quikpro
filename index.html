<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<link rel="manifest" href="/Quikpro/manifest.json">

<title>QuikPro</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0b0f;
  color: white;
  min-height: 100vh;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 22px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
  animation: apparition 0.3s ease;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 35px;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  object-fit: cover;
}

.brand {
  font-size: 24px;
  font-weight: bold;
}

.profile {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #202027;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.welcome {
  margin-bottom: 25px;
}

.welcome h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

.welcome p {
  color: #a5a5ad;
}

.main-button {
  width: 100%;
  border: none;
  border-radius: 18px;
  padding: 20px;
  background: white;
  color: black;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 30px;
}

.section-title {
  font-size: 20px;
  margin-bottom: 14px;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 30px;
}

.card {
  background: #17171d;
  border: 1px solid #25252d;
  border-radius: 18px;
  padding: 20px;
  min-height: 130px;
  cursor: pointer;
}

.icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.card h3 {
  font-size: 17px;
  margin-bottom: 5px;
}

.card p {
  color: #9999a3;
  font-size: 13px;
}

.project {
  background: #17171d;
  border: 1px solid #25252d;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
}

.project-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.project h3 {
  font-size: 17px;
}

.project span {
  color: #9999a3;
  font-size: 13px;
}

.project-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.small-button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  font-weight: bold;
}

.open-button {
  background: white;
  color: black;
}

.edit-button {
  background: #292931;
  color: white;
}

.delete-button {
  background: #3a2020;
  color: white;
}

.back {
  background: #17171d;
  color: white;
  border: 1px solid #292931;
  border-radius: 12px;
  padding: 10px 15px;
  cursor: pointer;
  margin-bottom: 25px;
}

.input {
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  border: 1px solid #30303a;
  background: #0b0b0f;
  color: white;
  font-size: 16px;
  outline: none;
  margin-bottom: 15px;
}

.create-button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: white;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.empty {
  color: #9999a3;
  text-align: center;
  padding: 25px;
}

.detail-box {
  background: #17171d;
  border: 1px solid #292931;
  border-radius: 20px;
  padding: 20px;
}

.detail-box h1 {
  margin-bottom: 10px;
}

.detail-box p {
  color: #9999a3;
  margin-bottom: 20px;
}

.bottom-nav {
  position: sticky;
  bottom: 12px;
  background: rgba(23,23,29,0.95);
  border: 1px solid #292931;
  border-radius: 20px;
  padding: 12px;
  display: flex;
  justify-content: space-around;
  margin-top: 25px;
}

.nav-item {
  background: none;
  border: none;
  color: #9999a3;
  font-size: 13px;
  cursor: pointer;
}

.nav-item.active {
  color: white;
  font-weight: bold;
}

@keyframes apparition {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<main class="app">

<!-- ACCUEIL -->

<section id="homeScreen" class="screen active">

<header>
  <div class="logo-area">
    <img
      class="logo"
      src="/Quikpro/quikpro-icon-192-1.png"
      alt="Logo QuikPro"
    >
    <div class="brand">QuikPro</div>
  </div>

  <div class="profile">👤</div>
</header>

<section class="welcome">
  <h1>Bienvenue 👋</h1>
  <p>Tout ce dont tu as besoin, rapidement.</p>
</section>

<button class="main-button" onclick="ouvrirCreation()">
🚀 Commencer
</button>

<h2 class="section-title">Actions rapides</h2>

<section class="actions">

<div class="card" onclick="ouvrirCreation()">
  <div class="icon">➕</div>
  <h3>Nouveau</h3>
  <p>Créer un projet</p>
</div>

<div class="card" onclick="afficherProjets()">
  <div class="icon">📁</div>
  <h3>Mes projets</h3>
  <p>Voir tes projets</p>
</div>

<div class="card" onclick="alert('Les outils arrivent bientôt ⚡')">
  <div class="icon">⚡</div>
  <h3>Outils</h3>
  <p>Outils QuikPro</p>
</div>

<div class="card" onclick="alert('Les paramètres arrivent bientôt ⚙️')">
  <div class="icon">⚙️</div>
  <h3>Paramètres</h3>
  <p>Personnaliser</p>
</div>

</section>

<h2 class="section-title">Dernière activité</h2>

<div id="lastProject"></div>

<nav class="bottom-nav">

<button class="nav-item active">
🏠<br>Accueil
</button>

<button class="nav-item" onclick="afficherProjets()">
📁<br>Projets
</button>

<button class="nav-item">
⚡<br>Outils
</button>

<button class="nav-item">
👤<br>Profil
</button>

</nav>

</section>


<!-- CRÉATION -->

<section id="createScreen" class="screen">

<button class="back" onclick="retourAccueil()">
← Retour
</button>

<div class="detail-box">

<h1>Créer un projet 🚀</h1>

<p>Donne un nom à ton nouveau projet.</p>

<input
id="projectName"
class="input"
type="text"
placeholder="Nom du projet"
maxlength="40"
>

<button class="create-button" onclick="creerProjet()">
Créer le projet
</button>

</div>

</section>


<!-- PROJETS -->

<section id="projectsScreen" class="screen">

<button class="back" onclick="retourAccueil()">
← Retour
</button>

<h1 style="margin-bottom:20px;">
Mes projets 📁
</h1>

<div id="projectsList"></div>

</section>


<!-- DÉTAIL PROJET -->

<section id="detailScreen" class="screen">

<button class="back" onclick="afficherProjets()">
← Mes projets
</button>

<div class="detail-box">

<h1 id="detailTitle"></h1>

<p id="detailDate"></p>

<button
class="create-button"
onclick="modifierProjetActuel()"
>
✏️ Modifier le projet
</button>

<br><br>

<button
class="small-button delete-button"
style="width:100%;"
onclick="supprimerProjetActuel()"
>
🗑️ Supprimer le projet
</button>

</div>

</section>


</main>


<script>

let projetActuel = null;


/* NAVIGATION */

function cacherEcrans() {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

}


function ouvrirCreation() {

  cacherEcrans();

  document
    .getElementById("createScreen")
    .classList.add("active");

  document
    .getElementById("projectName")
    .focus();

}


function retourAccueil() {

  cacherEcrans();

  document
    .getElementById("homeScreen")
    .classList.add("active");

  afficherDernierProjet();

}


/* CRÉATION */

function creerProjet() {

  const input =
    document.getElementById("projectName");

  const nom =
    input.value.trim();

  if (nom === "") {

    alert("Écris un nom pour ton projet 🙂");

    return;
  }

  let projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  projets.push({
    id: Date.now(),
    nom: nom,
    date: new Date().toLocaleDateString("fr-FR")
  });

  localStorage.setItem(
    "quikpro_projects",
    JSON.stringify(projets)
  );

  input.value = "";

  alert("Projet créé ! 🚀");

  afficherProjets();

}


/* AFFICHER PROJETS */

function afficherProjets() {

  cacherEcrans();

  document
    .getElementById("projectsScreen")
    .classList.add("active");

  const liste =
    document.getElementById("projectsList");

  const projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  if (projets.length === 0) {

    liste.innerHTML = `
      <div class="project">
        <div class="empty">
          Aucun projet pour le moment.
          <br><br>
          Appuie sur ➕ pour en créer un.
        </div>
      </div>
    `;

    return;
  }

  liste.innerHTML = "";

  projets.forEach(projet => {

    const element =
      document.createElement("div");

    element.className = "project";

    element.innerHTML = `

      <div class="project-top">

        <h3>🚀 ${echapper(projet.nom)}</h3>

        <span>
          ${projet.date}
        </span>

      </div>

      <div class="project-buttons">

        <button
          class="small-button open-button"
          onclick="ouvrirProjet(${projet.id})"
        >
          👀 Ouvrir
        </button>

        <button
          class="small-button edit-button"
          onclick="modifierProjet(${projet.id})"
        >
          ✏️ Modifier
        </button>

        <button
          class="small-button delete-button"
          onclick="supprimerProjet(${projet.id})"
        >
          🗑️
        </button>

      </div>

    `;

    liste.appendChild(element);

  });

}


/* OUVRIR */

function ouvrirProjet(id) {

  const projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  const projet =
    projets.find(p => p.id === id);

  if (!projet) return;

  projetActuel = id;

  document
    .getElementById("detailTitle")
    .textContent = "🚀 " + projet.nom;

  document
    .getElementById("detailDate")
    .textContent =
      "Créé le " + projet.date;

  cacherEcrans();

  document
    .getElementById("detailScreen")
    .classList.add("active");

}


/* MODIFIER */

function modifierProjet(id) {

  const projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  const projet =
    projets.find(p => p.id === id);

  if (!projet) return;

  const nouveauNom =
    prompt(
      "Nouveau nom du projet :",
      projet.nom
    );

  if (nouveauNom === null) return;

  if (nouveauNom.trim() === "") {

    alert("Le nom ne peut pas être vide.");

    return;
  }

  projet.nom =
    nouveauNom.trim();

  localStorage.setItem(
    "quikpro_projects",
    JSON.stringify(projets)
  );

  afficherProjets();

}


/* MODIFIER DEPUIS LE PROJET */

function modifierProjetActuel() {

  if (projetActuel === null) return;

  modifierProjet(projetActuel);

}


/* SUPPRIMER */

function supprimerProjet(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer ce projet ?"
    );

  if (!confirmation) return;

  let projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  projets =
    projets.filter(p => p.id !== id);

  localStorage.setItem(
    "quikpro_projects",
    JSON.stringify(projets)
  );

  afficherProjets();

}


/* SUPPRIMER DEPUIS LE PROJET */

function supprimerProjetActuel() {

  if (projetActuel === null) return;

  supprimerProjet(projetActuel);

}


/* DERNIER PROJET */

function afficherDernierProjet() {

  const zone =
    document.getElementById("lastProject");

  const projets =
    JSON.parse(
      localStorage.getItem("quikpro_projects")
    ) || [];

  if (projets.length === 0) {

    zone.innerHTML = `
      <div class="project">
        <div class="empty">
          Aucun projet pour le moment.
        </div>
      </div>
    `;

    return;
  }

  const dernier =
    projets[projets.length - 1];

  zone.innerHTML = `

    <div class="project">

      <div class="project-top">

        <h3>
          🚀 ${echapper(dernier.nom)}
        </h3>

        <span>
          ${dernier.date}
        </span>

      </div>

    </div>

  `;

}


/* PROTECTION TEXTE */

function echapper(texte) {

  return texte
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

  navigator.serviceWorker
    .register("/Quikpro/service-worker.js")
    .then(() => {
      console.log("Service Worker actif");
    })
    .catch(error => {
      console.log(
        "Erreur Service Worker :",
        error
      );
    });

}


/* CHARGEMENT */

afficherDernierProjet();

</script>

</body>
</html>
