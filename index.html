<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuikPro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
  padding-bottom: 70px;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 8px 0 0;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 15px;
}

.categories {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 20px;
}

.category-btn {
  border: 0;
  padding: 10px 15px;
  border-radius: 20px;
  background: white;
  white-space: nowrap;
}

.category-btn.active {
  background: #111827;
  color: white;
}

.service,
.add-section {
  background: white;
  padding: 18px;
  border-radius: 15px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.service h2 {
  margin-top: 0;
}

.category {
  display: inline-block;
  background: #e5e7eb;
  padding: 5px 9px;
  border-radius: 8px;
  font-size: 13px;
}

.description {
  margin: 12px 0;
  color: #4b5563;
}

.price {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 12px;
}

.contact {
  width: 100%;
  border: 0;
  padding: 13px;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.form-input {
  width: 100%;
  padding: 13px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

.add-button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.empty {
  text-align: center;
  padding: 25px;
  color: #6b7280;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111827;
  color: white;
  text-align: center;
  padding: 13px;
}
</style>
</head>

<body>

<header>
  <h1>QuikPro</h1>
  <p>Trouve ou propose un service près de chez toi</p>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="text"
    placeholder="🔎 Rechercher un service"
  >

  <div class="categories">
    <button class="category-btn active" onclick="filterCategory('Tous', this)">Tous</button>
    <button class="category-btn" onclick="filterCategory('Informatique', this)">💻 Informatique</button>
    <button class="category-btn" onclick="filterCategory('Jardinage', this)">🌱 Jardinage</button>
    <button class="category-btn" onclick="filterCategory('Bricolage', this)">🔨 Bricolage</button>
    <button class="category-btn" onclick="filterCategory('Animaux', this)">🐶 Animaux</button>
  </div>

  <div id="services"></div>

  <div class="add-section">

    <h2>➕ Proposer un service</h2>

    <input
      id="title"
      class="form-input"
      type="text"
      placeholder="Nom du service"
    >

    <input
      id="category"
      class="form-input"
      type="text"
      placeholder="Catégorie"
    >

    <input
      id="price"
      class="form-input"
      type="number"
      placeholder="Prix (€)"
    >

    <input
      id="phone"
      class="form-input"
      type="tel"
      placeholder="📱 Numéro WhatsApp"
    >

    <textarea
      id="description"
      class="form-input"
      rows="4"
      placeholder="Description"
    ></textarea>

    <button
      class="add-button"
      onclick="addService()"
    >
      Publier
    </button>

  </div>

</div>

<footer>
  QuikPro
</footer>

<script>

let services = JSON.parse(
  localStorage.getItem("quikpro_services")
) || [
  {
    title: "Aide informatique",
    category: "Informatique",
    price: 15,
    description: "Aide pour ordinateur, téléphone et logiciels.",
    phone: ""
  },
  {
    title: "Tonte de pelouse",
    category: "Jardinage",
    price: 20,
    description: "Aide pour entretenir une pelouse.",
    phone: ""
  }
];

let currentCategory = "Tous";

function saveServices() {
  localStorage.setItem(
    "quikpro_services",
    JSON.stringify(services)
  );
}

function displayServices() {

  const container = document.getElementById("services");

  const search = document
    .getElementById("search")
    .value
    .toLowerCase();

  container.innerHTML = "";

  const results = services.filter(service => {

    const categoryOK =
      currentCategory === "Tous" ||
      service.category.toLowerCase() ===
      currentCategory.toLowerCase();

    const searchOK =
      service.title.toLowerCase().includes(search) ||
      service.category.toLowerCase().includes(search) ||
      service.description.toLowerCase().includes(search);

    return categoryOK && searchOK;
  });

  if (results.length === 0) {
    container.innerHTML =
      '<div class="empty">Aucun service trouvé.</div>';
    return;
  }

  results.forEach((service, index) => {

    const card = document.createElement("div");

    card.className = "service";

    card.innerHTML = `
      <h2>${service.title}</h2>

      <span class="category">
        ${service.category}
      </span>

      <div class="description">
        ${service.description}
      </div>

      <div class="price">
        ${service.price} €
      </div>

      <button
        class="contact"
        onclick="contactWhatsApp(${index})"
      >
        💬 Contacter
      </button>
    `;

    container.appendChild(card);
  });
}

function contactWhatsApp(index) {

  const service = services[index];

  if (!service.phone) {

    alert(
      "Ce service n'a pas de numéro WhatsApp."
    );

    return;
  }

  let phone = service.phone
    .replace(/\s/g, "")
    .replace(/-/g, "")
    .replace(/\./g, "");

  if (phone.startsWith("0")) {
    phone = "33" + phone.substring(1);
  }

  if (phone.startsWith("+")) {
    phone = phone.substring(1);
  }

  const message =
    "Bonjour, je vous contacte depuis QuikPro concernant votre service : " +
    service.title;

  const url =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank");
}

function filterCategory(category, button) {

  currentCategory = category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  displayServices();
}

function addService() {

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const description =
    document.getElementById("description").value.trim();

  if (!title || !category || !price || !description) {

    alert(
      "Remplis le nom, la catégorie, le prix et la description."
    );

    return;
  }

  services.push({
    title: title,
    category: category,
    price: price,
    description: description,
    phone: phone
  });

  saveServices();

  document.getElementById("title").value = "";
  document.getElementById("category").value = "";
  document.getElementById("price").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("description").value = "";

  displayServices();

  alert("Service publié !");
}

document
  .getElementById("search")
  .addEventListener(
    "input",
    displayServices
  );

displayServices();

</script>

</body>
</html>
